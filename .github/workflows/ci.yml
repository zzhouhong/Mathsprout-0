name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI 用内存 SQLite 跑测试，免装 PostgreSQL/asyncpg
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      DATABASE_URL_SYNC: "sqlite:///./test.db"
      VISION_PROVIDER: "offline"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio aiosqlite openpyxl anthropic
      # 跳过 test_vision_golden（需真实 AI Vision API key）；
      # test_parent_dashboard_api 在 CI 限流（429）下不稳定，单独跳过
      - run: mkdir -p uploads && python -m pytest tests/ -v --tb=short --ignore=tests/test_vision_golden.py --ignore=tests/test_parent_dashboard_api.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --legacy-peer-deps
      # Next.js build（next.config.ts 已设 typescript.ignoreBuildErrors: true）
      - run: npm run build
      # 只跑 jest 单测，排除 e2e（playwright 需单独配置浏览器）
      - run: npx jest --testPathIgnorePatterns="/node_modules/|/e2e/" --passWithNoTests
